[project]
name = "finben-fpb-audit"
version = "1.0.0"
description = "Gemma 4 E4B fine-tuned on FinBen FPB on an 8 GB GPU, with a train/test contamination audit and a fresh-data test of FinMA-7B"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "unsloth",
    "transformers",
    "trl",
    "peft",
    "accelerate",
    "bitsandbytes",
    "datasets",
    "kagglehub",
    "huggingface_hub",
    "pandas",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "sentencepiece",   # FinMA-7B ships only a slow LLaMA tokenizer (tokenizer.model)
]

# PyTorch wheels built against CUDA 12.8 (required for RTX 50-series / Blackwell GPUs).
# For other GPUs, point these at the index that matches your CUDA version.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
package = true   # installs ftlib/ so the scripts can `import ftlib`

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["ftlib"]
